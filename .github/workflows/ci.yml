name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  self-tests:
    name: Self-tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Qt (PySide6) needs these shared libs even under the offscreen platform,
      # for the GUI self-tests.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install the project (with GUI + dev extras)
        run: pip install -e ".[gui,dev]"

      # Framework self-validation only — no DUT, NIC, or elevated privileges
      # required. The DUT-facing tests under tests/ need real hardware.
      - name: Run framework self-tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests_internal/ -v
