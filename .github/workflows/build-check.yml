name: Build check

# Smoke-build the single-file app for Windows and Linux on every push to
# main, so a packaging break is caught here rather than when a release tag
# is pushed. Does not upload or publish anything — release.yml (tag-driven)
# owns the actual GitHub Release.
on:
  push:
    branches: [main]

jobs:
  build:
    uses: ./.github/workflows/build.yml
