name: Release

# Build the single-file app for Windows and Linux and publish both to a
# GitHub Release. Triggered by pushing a version tag (v*), or manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.4.0)"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project (GUI + dev extras, incl. PyInstaller)
        run: pip install -e ".[gui,dev]"

      - name: Build
        run: python -m PyInstaller NetstackTestSuite.spec --noconfirm

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          cp dist/NetstackTestSuite.exe out/NetstackTestSuite-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Qt (PySide6) shared libs — PyInstaller needs them present at build
      # time to bundle them, and the target machine needs them at runtime.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install the project (GUI + dev extras, incl. PyInstaller)
        run: pip install -e ".[gui,dev]"

      - name: Build
        run: python -m PyInstaller NetstackTestSuite.spec --noconfirm

      - name: Stage artifact
        run: |
          mkdir -p out
          cp dist/NetstackTestSuite out/NetstackTestSuite-linux-x86_64
          chmod +x out/NetstackTestSuite-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  release:
    name: Publish release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            artifacts/windows/NetstackTestSuite-windows-x64.exe
            artifacts/linux/NetstackTestSuite-linux-x86_64
          fail_on_unmatched_files: true
          body: |
            Single-file builds of the Network Stack Test Suite (GUI + bundled test suite).

            | Asset | Platform | How to run |
            |---|---|---|
            | `NetstackTestSuite-windows-x64.exe` | Windows x64 | Double-click — self-elevates via UAC. Needs [Npcap](https://npcap.com). |
            | `NetstackTestSuite-linux-x86_64` | Linux x86_64 | `chmod +x` then run. Raw sockets need root: run with `sudo`, or once run `sudo setcap cap_net_raw,cap_net_admin+eip ./NetstackTestSuite-linux-x86_64`. Needs a desktop session + Qt libs (`libegl1 libgl1 libxkbcommon0 libdbus-1-3`). |

            See [`packaging/README.md`](https://github.com/AlexRudyak/netstack-test-suite/blob/main/packaging/README.md).
