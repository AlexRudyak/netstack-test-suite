name: Build check

# Smoke-build the single-file app for Windows and Linux on every push to
# main, so a packaging break is caught here rather than when a release tag
# is pushed. Does not upload or publish anything — release.yml (tag-driven)
# owns the actual GitHub Release.
on:
  push:
    branches: [main]

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project (GUI + dev extras, incl. PyInstaller)
        run: pip install -e ".[gui,dev]"

      - name: Build
        run: python -m PyInstaller NetstackTestSuite.spec --noconfirm

  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Qt (PySide6) shared libs — PyInstaller needs them present at build
      # time to bundle them.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install the project (GUI + dev extras, incl. PyInstaller)
        run: pip install -e ".[gui,dev]"

      - name: Build
        run: python -m PyInstaller NetstackTestSuite.spec --noconfirm
